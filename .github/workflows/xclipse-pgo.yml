name: Xclipse Android PGO

on:
  push:
    branches:
      - feature/xclipse-pgo-auto-training-20261002
  workflow_dispatch:
    inputs:
      mode:
        description: Generate a training APK or use an exported profile
        type: choice
        options: [GENERATE, USE]
        default: GENERATE
      corpus:
        description: Repository path to a complete exported training ZIP (USE only)
        type: string
        default: pgo/training.zip

concurrency:
  group: xclipse-pgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-pgo:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      MODE: ${{ inputs.mode || 'GENERATE' }}
      CORPUS: ${{ inputs.corpus || 'pgo/training.zip' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test PGO profile validation
        run: python3 -m unittest discover -s tools/tests -p 'test_pgo*.py' -v
      - name: Install Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Prepare profile and source identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID=$(python3 tools/pgo_profile.py identity)
          TOOLCHAIN="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "$MODE" in
            GENERATE) ;;
            USE)
              python3 tools/pgo_profile.py merge "$CORPUS" --build-id "$BUILD_ID" \
                --toolchain "$TOOLCHAIN" --output "$RUNNER_TEMP/eden.profdata"
              ;;
            *) exit 1 ;;
          esac
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "PROFILE=$RUNNER_TEMP/eden.profdata" >> "$GITHUB_ENV"
      - name: Build upgradeable optimized APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --target standard --build-type RelWithDebInfo \
            -DEDEN_PGO_MODE="$MODE" -DEDEN_PGO_BUILD_ID="$BUILD_ID" \
            -DEDEN_PGO_PROFILE="$PROFILE" -DENABLE_LTO=ON
      - name: Upload APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eden-xclipse-pgo-${{ env.MODE }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
