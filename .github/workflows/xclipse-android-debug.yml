name: Xclipse Android Debug

on:
  push:
    branches:
      - "feature/xclipse-*"
  workflow_dispatch:

concurrency:
  group: xclipse-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.31.6"

      - name: Build standard debug APK
        shell: bash
        env:
          CCACHE: "false"
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --target standard --build-type Debug

      - name: Upload debug artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-xclipse-debug-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
