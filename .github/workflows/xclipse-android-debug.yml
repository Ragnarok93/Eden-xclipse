name: Xclipse Android Optimized Diagnostics

on:
  push:
    branches:
      - "feature/xclipse-*"
  workflow_dispatch:

concurrency:
  group: xclipse-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Publish pending build status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"xclipse/android-debug\",\"description\":\"Xclipse optimized diagnostic build running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install host shader tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.31.6"

      - name: Preconfigure Android native build
        shell: bash
        env:
          CCACHE: "false"
        run: |
          cd src/android
          chmod +x ./gradlew
          ./gradlew ':app:configureCMakeRelWithDebInfo[arm64-v8a]' \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=false" \
            --info

      - name: Build optimized diagnostic APK
        shell: bash
        env:
          CCACHE: "false"
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --target standard --build-type RelWithDebInfo

      - name: Upload optimized diagnostic artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-xclipse-diagnostic-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish connector-visible build status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ job.status }}" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"xclipse/android-debug\",\"description\":\"Xclipse optimized diagnostic build ${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  policy-tests:
    name: Xclipse policy verification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install focused host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build catch2 libvulkan-dev

      - name: Build actual policy sources and existing regression tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xclipse-policy"
          cat > "$RUNNER_TEMP/xclipse-policy/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(xclipse_policy_gate LANGUAGES CXX)
          find_package(Catch2 3 REQUIRED)
          find_package(Vulkan REQUIRED)
          enable_testing()
          add_executable(policy_tests
            "${EDEN_SOURCE_DIR}/src/video_core/vulkan_common/vulkan_device_profile.cpp"
            "${EDEN_SOURCE_DIR}/src/video_core/renderer_vulkan/vk_pipeline_policy.cpp"
            "${EDEN_SOURCE_DIR}/src/tests/video_core/vulkan_device_profile.cpp"
            "${EDEN_SOURCE_DIR}/src/tests/video_core/vulkan_feature_policy.cpp"
            "${EDEN_SOURCE_DIR}/src/tests/video_core/xclipse_pipeline_policy.cpp")
          target_compile_features(policy_tests PRIVATE cxx_std_20)
          target_include_directories(policy_tests PRIVATE "${EDEN_SOURCE_DIR}/src" ${Vulkan_INCLUDE_DIRS})
          target_link_libraries(policy_tests PRIVATE Catch2::Catch2WithMain)
          add_test(NAME policy_gate COMMAND policy_tests)
          CMAKE
          cmake -S "$RUNNER_TEMP/xclipse-policy" -B "$RUNNER_TEMP/xclipse-policy/build" -G Ninja \
            -DEDEN_SOURCE_DIR="$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/xclipse-policy/build" --parallel 2

      - name: Run policy gate without skipping failing tests
        run: ctest --test-dir "$RUNNER_TEMP/xclipse-policy/build" --output-on-failure

      - name: Upload policy test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xclipse-policy-test-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/xclipse-policy/build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

